<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt | Few/Meh Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top custom-navigacija">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="media/logofewmeh.svg" alt="Few/Meh Logo">
                <span>FEW/MEH STUDIO</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#glavnaNavigacija" aria-controls="glavnaNavigacija" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="glavnaNavigacija">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="index.html#o-nama">O nama</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#objavljene">Igre</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#razvoj">U razvoju</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#video">Trailer</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#tim">Tim</a></li>
                    <li class="nav-item"><a class="nav-link" href="zaposlise.html">Zaposli se</a></li>
                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                        <a href="kontakt.html" class="btn btn-outline-primary rounded-pill px-4 text-white w-100 w-lg-auto">Kontakt</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5 mt-3">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Kontaktiraj nas</h2>
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Ime i prezime</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email adresa</label>
                                <input type="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Poruka ili link na portfolio</label>
                                <textarea class="form-control" rows="4"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Pošalji prijavu</button>
                        </form>
                        <div class="mt-4 text-center">
                            <a href="index.html" class="text-decoration-none">&larr; Povratak na početnu</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
